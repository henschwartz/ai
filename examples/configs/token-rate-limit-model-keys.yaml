# Token Rate Limiting -- Per-Model Bucket Keys
#
# Extends token-rate-limit.yaml with M5 model dimensions (ai#123): each
# distinct model identity gets its own token budget under the same
# catch-all rule. The model is taken from `x-model` when present,
# otherwise from the JSON body `model` field once the body is buffered.
# Missing model identity is rejected (400) unless you set
# `missing: fallback`.
#
# Usage:
#   cargo run -p praxis-ai-proxy --features token-rate-limit-filter -- -c examples/configs/token-rate-limit-model-keys.yaml
#   curl -i http://localhost:8080/v1/chat/completions \
#     -H 'x-model: gpt-4' \
#     -d '{"model":"gpt-4","messages":[{"role":"user","content":"hi"}]}'
#
# Prefer `x-model` (or another header via `key: { model: { header: ... } }`)
# when admission uses a fixed estimate: the JSON body `model` field is
# only read when a body-dependent estimation strategy has already
# buffered the request.
#
# See token-rate-limit.yaml for reservation-based admission (M2),
# reconciliation, M4 token-type weights, and the `rules:` schema.
# Pair with `max_keys` in production so a client cannot fill the key
# table by inventing model names.
#
# Supported token_count provider values:
#   openai | anthropic | google | bedrock | azure

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: router
        routes:
          - path: "/v1/chat/completions"
            cluster: backend

      - filter: token_rate_limit
        key: model
        max_keys: 100000
        default_weights:
          input: 1.0
          output: 1.0
          cached_input: 0.1
          cache_write: 1.25
          reasoning: 0.9
        rules:
          - name: default
            algorithm: sliding_window
            window: 1h
            capacity: 100000
            reserved_tokens: 500

      - filter: token_count
        provider: openai

      - filter: access_log

      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"

insecure_options:
  allow_private_endpoints: true
